name: Build plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: LettuceGames
        working-directory: games
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: LettuceCore
        working-directory: core
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: LettuceChat
        working-directory: chat
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: LettuceRestart
        working-directory: restart
        run: bash build.sh

      - name: Collect jars
        run: |
          mkdir -p dist
          cp games/build/libs/LettuceGames-*.jar dist/
          cp core/build/libs/LettuceCore-*.jar dist/
          cp chat/build/libs/LettuceChat-*.jar dist/
          cp restart/LettuceRestart-*.jar dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: lettuce-plugins
          path: dist/*.jar

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
