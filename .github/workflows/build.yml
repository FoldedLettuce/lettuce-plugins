name: Build plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: LettuceGames
        working-directory: games
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: LettuceCore
        working-directory: core
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: LettuceChat
        working-directory: chat
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: LettuceRestart
        working-directory: restart
        run: bash build.sh

      - name: Collect jars
        run: |
          mkdir -p dist
          cp games/build/libs/LettuceGames-*.jar dist/
          cp core/build/libs/LettuceCore-*.jar dist/
          cp chat/build/libs/LettuceChat-*.jar dist/
          cp restart/LettuceRestart-*.jar dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: lettuce-plugins
          path: dist/*.jar

      - name: Pick release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(date -u +%Y.%m.%d)-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # every push to main (and every manual tag) becomes a release with all four jars
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.jar
          generate_release_notes: true
          make_latest: true
