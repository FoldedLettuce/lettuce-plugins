header-footer:
  enabled: true
  designs:
    skyblock:
      display-condition: '%server%=skyblock'
      header:
        - "<#FFFFFF>&m                                                </#FFFF00>"
        - "&a&lLETTUCE MC &8- &b&lSKYBLOCK"
        - "&r&7&l>> %animation:Welcome%&3 &l%player%&7&l! &7&l<<"
        - "&r&7Online: &f%online%"
        - "&6Online staff: &e%staffonline%"
        - ""
      footer:
        - "%animation:time%"
        - "&2Ping: %ping%"
        - ""
        - "%animation:skyblocktips%"
        - "<#FFFFFF>&m                                                </#FFFF00>"
    games:
      display-condition: '%server%=games'
      header:
        - "<#FFFFFF>&m                                                </#FFFF00>"
        - "&a&lLETTUCE MC &8- &c&lGAMES"
        - "&r&7&l>> %animation:Welcome%&3 &l%player%&7&l! &7&l<<"
        - "&r&7Online: &f%online%"
        - "&6Online staff: &e%staffonline%"
        - ""
      footer:
        - "%animation:time%"
        - "&2Ping: %ping%"
        - ""
        - "&7Party up with &d/p invite <name>"
        - "<#FFFFFF>&m                                                </#FFFF00>"
    default:
      header:
        - "<#FFFFFF>&m                                                </#FFFF00>"
        - "&a&lLETTUCE MC"
        - "&r&7&l>> %animation:Welcome%&3 &l%player%&7&l! &7&l<<"
        - "&r&7You're on &f%server% &8| &7Online: &f%online%"
        - "&6Online staff: &e%staffonline%"
        - ""
      footer:
        - "%animation:time%"
        - "&2Ping: %ping%"
        - ""
        - "%animation:tips%"
        - "<#FFFFFF>&m                                                </#FFFF00>"
        
tablist-name-formatting:
  enabled: true
scoreboard-teams:
  enabled: true
  # Games uses its own team colors for RIC teams
  disable-condition: '%server%=games'
  enable-collision: true
  invisible-nametags: false
  sorting-types:
    - "GROUPS:owner,admin,lettuce,section-sup,unit-sup,team-member,default"
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: true
playerlist-objective:
  enabled: true
  value: '%ping%'
  fancy-value: '&7Ping: %ping%'
  title: TAB
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'
belowname-objective:
  enabled: false
  value: '%health%'
  fancy-value: '&c%health%'
  fancy-value-default: NPC
  title: '&cHealth'
  disable-condition: '%world%=disabledworld'
  view-distance: 10
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: PROGRESS
      color: '%animation:barcolors%'
      progress: '100'
      text: '&fWebsite: &bwww.domain.com'
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: true
  hidden-by-default: false
  delay-on-join-milliseconds: 1000
  scoreboards:
    lobby:
      display-condition: '%server%=lobby'
      title: '&a&lLETTUCE MC'
      lines:
        - '&7&m                    '
        - '&fRank: %luckperms-prefix%'
        - ''
        - '&fOnline: &a%online%'
        - ''
        - '&7Use the compass to'
        - '&7pick a server!'
        - '&7&m                    '
    skyblock:
      display-condition: '%server%=skyblock'
      title: '&a&lLettuce MC'
      lines:
        - '&eLevel: &f%Level_bskyblock_island_level%'
        - '&eTier: &f%bskyblock_challenges_latest_level_name%'
        - '&bMoney: &f$%vault_eco_balance_commas%'
        - ''
        - '&a/info &7for help'
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:37e93c8e12cd426cb28fce31969e0674
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    default:
      slot-count: 80
      fixed-slots:
      - '1|&3Website&f:'
      - 2|&bmyserver.net
      - '3|&8&m                       '
      - '4|&3Name&f:'
      - 5|&b%player%
      - '7|&3Rank&f:'
      - '8|Rank: %group%'
      - '10|&3World&f:'
      - 11|&b%world%
      - '13|&3Time&f:'
      - 14|&b%time%
      - '21|&3Teamspeak&f:'
      - 22|&bts.myserver.net
      - '23|&8&m                       '
      - '41|&3Store&f:'
      - 42|&bshop.myserver.net
      - '43|&8&m                       '
      groups:
        staff:
          display-condition: permission:tab.staff
          slots:
          - 24-40
        players:
          slots:
          - 44-80
ping-spoof:
  enabled: false
  value: 0
global-playerlist:
  enabled: true
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  server-groups:
    network:
    - lobby
    - survival1
    - skyblock
    - survival2
    - games
  update-latency: false
placeholders:
  date-format: MM/dd/yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  register-tab-expansion: false
  locale: en-US
placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%player%'
    false: ~%essentials_nickname%
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%rel_factionsuuid_relation_color%': 1000
  '%vault_eco_balance_commas%': 2000
  '%Level_bskyblock_island_level%': 5000
  '%bskyblock_challenges_latest_level_name%': 5000
assign-groups-by-permissions: false
primary-group-finding-list:
  - owner
  - lettuce
  - section-sup
  - unit-sup
  - team-member
  - default
permission-refresh-interval: 1000
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
  useSSL: true
proxy-support:
  enabled: true
  channel-name-suffix: custom
  type: PLUGIN
  plugin:
    name: RedisBungee
  redis:
    url: redis://:password@localhost:6379/0
  rabbitmq:
    exchange: plugin
    url: amqp://guest:guest@localhost:5672/%2F
components:
  minimessage-support: true
  disable-shadow-for-heads: true
config-version: 7
per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
  - ignoredworld
  - build
  shared-playerlist-world-groups:
    lobby:
    - lobby1
    - lobby2
    minigames:
    - paintball
    - bedwars
compensate-for-packetevents-bug: false
use-bukkit-permissions-manager: false
use-online-uuid-in-tablist: true
