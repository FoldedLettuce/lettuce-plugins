# ---------------------------------------------------------------- Manhunt / Hitman
hunt:
  # Everyone is frozen this long at the start of Manhunt, then the runner head start begins
  start-freeze-seconds: 5
  # How many OP loot rolls drop when "Hunters/Runners Drop OP Loot" is on
  op-loot-on-death: 3
hitman:
  # How far out the hitmen ring spawns around the survivors (blocks)
  ring-distance: 40

# ---------------------------------------------------------------- Structure Mania twist
structure-mania:
  # Vanilla structure ids it picks from (anything /place structure takes). Big ones like mansion
  # and ancient_city are left out on purpose, they lag.
  structures: [village_plains, village_desert, village_savanna, village_snowy, village_taiga, desert_pyramid,
               jungle_pyramid, igloo, swamp_hut, pillager_outpost, shipwreck, ruined_portal, ocean_ruin_warm,
               ocean_ruin_cold, trail_ruins, nether_fossil, bastion_remnant, fortress, end_city]

# ---------------------------------------------------------------- Death Shuffle
death-shuffle:
  # Deaths that need a certain biome or structure (berry bushes, cactus, villages...) only get handed out
  # if one is within this many blocks of you
  max-distance: 600

