# LettuceGames config. /lg reload after editing.

# Parties are switched off for now: everyone on the Games server is one group,
# anyone can change settings, and the game starts when everyone's ready.
parties-enabled: false

# Parties off: the first person to ready up starts this countdown, and whoever's ready when it hits 0 plays.
# Drops to 5 seconds once everyone on the server is ready.
ready-countdown-seconds: 60

# How many maps to keep generated and waiting. Each is used once then deleted.
# A new one starts generating in the background the moment a game takes one.
ready-maps: 2
# How much of each ready map gets pre-generated, and how fast. Lower = lighter on the server.
# Chunks are requested this many per tick (every other tick while a game is running).
ready-map-preload-blocks: 96
ready-map-chunks-per-tick: 1

# Most games that can run at once. Each game is its own world, so this is mostly about RAM/CPU.
max-games: 4

# Fewest players a party needs to start (admins can /p start below this for testing)
min-players: 2

# Seconds of "5, 4, 3..." once everyone's ready (parties on)
start-countdown-seconds: 5

# Seconds to stay in the finished game before everyone goes back to the waiting area
end-delay-seconds: 10

# Game worlds are named <prefix><id> and deleted when the game ends (and on startup if left over)
world-prefix: "lg_"

# Keep the waiting area at noon with no rain
lobby-always-day: true

party:
  invite-expire-seconds: 60

# Set with /lg setlobby (defaults to the main world spawn)
lobby:
  world: ""

# How eliminated players spectate at first. They can switch any time with /specmode.
#   spectator = real spectator mode (noclip, see through players' eyes)
#   ghost     = invisible creative-style flying, double-tap jump to fly/walk
spectator-default: ghost
# Walk/fly spectators still show in the tab list (gray [Spec]). They stay invisible, silent and nametag-less
# to players, and arrows/mobs ignore them. false = fully hide them from players (they drop out of tab).
spectator-tablist: true

# Pre-generate this many blocks around spawn before anyone teleports in (128 = 17x17 chunks)
preload-radius-blocks: 128
# Start anyway if pre-generating takes longer than this
preload-timeout-seconds: 60

# Border and zone speeds. Each side of the border moves this many blocks per second (walking is ~4.3, sprinting ~5.6).
# Lower = slower, more time to run. The shrink time is worked out from the distance.
border:
  normal-speed: 1.5
  rush-speed: 2.5
zones:
  wait-seconds: 45
  shrink-speed: 1.5

item-pool:
  # Chance a drop (after the first) is a splash potion instead of an item
  potion-chance: 0.08
  # Never more than this many drops in a row without a weapon or armor (0 = off)
  gear-pity: 2
  # Which splash potions can show up (no night vision, water breathing, luck and other junk)
  potions: [HEALING, STRONG_HEALING, HARMING, STRONG_HARMING, REGENERATION, STRONG_REGENERATION,
            STRENGTH, STRONG_STRENGTH, SWIFTNESS, STRONG_SWIFTNESS, POISON, STRONG_POISON,
            SLOWNESS, STRONG_SLOWNESS, WEAKNESS, INVISIBILITY, FIRE_RESISTANCE, TURTLE_MASTER, LEAPING, SLOW_FALLING]
  # Edible items only show up when the "Eating Gives a Random Effect" twist is on.
  # List anything here that should show up anyway (like GOLDEN_APPLE).
  edible-exceptions:
  - GOLDEN_APPLE
  - ENCHANTED_GOLDEN_APPLE
  # Every drop picks a group by weight, then an item from that group.
  # The first drop of a game only uses blocks and utility.
  # "requires" groups only count when that setting is on: crafting, eat-effect, spawn-eggs
  # "stack-size" caps how many of an item come per stack
  # A drop is one random item: gear is a single piece, blocks come as Drop Size full stacks. Items written ITEM:amount
  # (TNT:64) always come as one stack of exactly that many, for things you do not want 3 stacks of.
