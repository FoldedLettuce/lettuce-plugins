# ---------------------------------------------------------------- Death Swap
deathswap:
  # Dying this many seconds after a swap credits the kill to whoever's spot you landed in
  trap-credit-seconds: 20
  # How far from the middle each player spawns (they're spread evenly on a ring this far out).
  # 100 = about 200 blocks apart with 2 players, about 140 with 4.
  spread-distance: 100
  # Most ores Vein Miner breaks at once
  vein-miner-max: 64

# OP Loot table for the OP Loot twists (Death Swap, Manhunt, Hitman). One random line per drop.
# Format: ITEM amount weight [enchanted]   (enchanted = 2-4 max level enchants)
